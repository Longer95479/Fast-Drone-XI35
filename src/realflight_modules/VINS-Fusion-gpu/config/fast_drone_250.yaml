%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1         
num_of_cam: 2


imu_topic: "/mavros/imu/data_raw"
image0_topic: "/camera/infra1/image_rect_raw"
image1_topic: "/camera/infra2/image_rect_raw"

output_path: ""

cam0_calib: "left.yaml"
cam1_calib: "right.yaml"
image_width: 640
image_height: 480
   
# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 1   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -1.6502178783956989e-03, 3.8159729902645587e-02,
       9.9927028965876463e-01, 6.7782305102990950e-02,
       -9.9851533060681685e-01, -5.4469704418659060e-02,
       4.3109593323412105e-04, 3.9454274329887521e-03,
       5.4446407816435012e-02, -9.9778599224197440e-01,
       3.8192962199669389e-02, 5.7271088389329469e-02, 0., 0., 0., 1. ]
body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -1.7994482244809706e-03, 3.8125300859755892e-02,
       9.9927134624207070e-01, 6.7388874152142841e-02,
       -9.9850664723202087e-01, -5.4629602899542329e-02,
       2.8621758641993639e-04, -4.4419075927211317e-02,
       5.4600708965689082e-02, -9.9777856657747022e-01,
       3.8166669478128634e-02, 6.0067053959264829e-02, 0., 0., 0., 1. ]

#Multiple thread support
multiple_thread: 1
use_gpu: 1
use_gpu_acc_flow: 1

#feature traker paprameters
max_cnt: 150            # max feature number in feature tracking
min_dist: 30            # min distance between two features 30
freq: 10                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.05  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)10.0

#imu parameters       The more accurate parameters you provide, the better performance
acc_n: 0.1          # accelerometer measurement noise standard deviation. #0.2   0.04
gyr_n: 0.01         # gyroscope measurement noise standard deviation.     #0.05  0.004
acc_w: 0.001         # accelerometer bias random work noise standard deviation.  #0.002
gyr_w: 0.0001       # gyroscope bias random work noise standard deviation.     #4.0e-5
g_norm: 9.805         # gravity magnitude

#unsynchronization parameters
estimate_td: 1                      # online estimate time offset between camera and imu
#td: -0.003116                            # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)
td: -0.001                           # -0.001 initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "/home/orin02/savedfiles/output/pose_graph/" # save and load path
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0 

odometry_type: 0 #0为原始里程计，1为加了偏置后的里程计
drone_id: 1
single_offset: 2.0

enable_pub_imu_path: 1

enable_imu_odom_smooth: 1
velocity_limit: 1.5

set_initial_yaw: 0 #设置初始yaw，单位：° 155

use_external_front_end: 1 #0：前端使用自带的光流跟踪，1：使用外部特征跟踪器

record_csv: 0 #记录滑窗优化最新帧的时间戳、滑窗内可用的特征点数目、xyz、td
csv_file_path: "/home/nx05/csv/vins_backend/xp_opticalflow_retrack.csv" #sp_opticalflow.csv, sp_lg_version.csv, original_version.csv, xp_opticalflow.csv

#superpoint & light glue
plnet:
    use_opticalflow: 1 #0：匹配使用lightglue 1：使用光流
    use_superpoint: 2   #1: superpoint 2: xfeat
    use_retrack: 1 #1: 使用描述子匹配进行重跟踪
    max_keypoints: 300  #200 250 sp或xfeat提取特征点数量上限
    keypoint_threshold: 0.1 #0.004 0.001 for superpoint 0.05 ~ 0.1for xfeat
    remove_borders: 4
    dist_thresh: 30 #nms dist for extracting new points
    line_threshold: 0.75
    line_length_threshold: 50
    pub_freq: 10 #前端处理频率
    show_track: 3 #0：不显示，1：显示左目与上一帧匹配结果，2：显示左右目匹配结果 3：可视化左目特征点追踪次数
    use_opticalflow_stereo: 1 #0：左右目匹配使用superpoint+lightglue 1：左右目匹配使用光流 （左目跟踪采用光流的情况下此选项无效）

    record_csv: 0 # 记录当前帧成功追踪的特征点数量
    csv_file_path: "/home/nx05/csv/vins-frontend/xp_opticalflow_retrack.csv" # xp_opticalflow.csv

    of_max_cnt: 150 # max feature number in feature tracking for opticalflow 200
    of_min_dist: 30 # min distance between two features for opticalflow 光流nms半径 20

    resized_width: 640   #神经网络输入图像尺寸
    resized_height: 480

    superpoint_onnx_model: "superpoint_v1_sim_int32.onnx"
    superpoint_trt_model: "superpoint_v1_sim_int32.engine"
    xfeat_onnx_model: "xfeat.onnx"
    xfeat_trt_model: "xfeat.engine"
    plnet_s0_onnx_model: "plnet_s0.onnx"
    plnet_s0_trt_model: "plnet_s0.engine"
    plnet_s1_onnx_model: "plnet_s1.onnx"
    plnet_s1_trt_model: "plnet_s1.engine"

#opticalflow with xfeat
xfeat_opticalflow:
    max_search_dist: 100 #搜寻最近成功点的最大搜寻距离，超过这个距离视为搜寻失败
    max_roi_len: 40 #预测点的最大ROI边长
    min_match_dist: 0.9 #匹配成功的最小余弦距离
    roi_pts_threshold: 0.1 #roi内视为特征点的heatmap阈值
    
point_matcher:
    matcher: 0   # 0 for lightglue
    F_threshold: 1.0 # 3.0
    image_width: 640
    image_height: 480
    onnx_file: "superpoint_lightglue.onnx"
    engine_file: "superpoint_lightglue.engine"

line_config:
    show_line: 1 #0：不显示 1：显示追踪次数 2：显示垂直线条
    pub_image_at_backend: 1 #1：发布经过后端处理后的图像
    detect_vertical_at_front: 0 #是否在前端检测垂直线段
    line_min_obs: 3 #三角化线特征所需最小的观测数
    line_max_cosine_dist: 0.998 #参与的三角化两个平面法向量的最大余弦距离
    equalize: 1 #直方图均衡化（仅lsd需要）
    outliers_thresh: 3.0 #优化后剔除线特征外点的阈值(单位：像素)
    enable_triang_opti_only: 1 #三角化后进行只针对线的优化(仅用于非结构线)
    enable_line_opti: 1 #线特征是否加入滑窗优化(仅用于非结构线)
    enable_line_nms: 1 #是否对新提取的线进行非极大抑制
    two_line_ang_thresh: 0.1047 #rad nms
    two_line_dist_thresh: 20 #nms
    associate_pts_at_front: 0 #在前端进行点线关联（用于点线关联debug）

    use_struct_line: 1 #0：普通线特征 1：结构化线特征
    vertical_judge_dist: 5 #用于结构线划分 单位：像素
    vertical_judge_ang: 0.1047 #用于结构线划分，单位：rad (6° = 0.1047 ， 5° = 0.0873)  
    new_mht_detect_thresh: 0.5 #划分成功线条比例小于阈值时检测新的局部曼哈顿
    ransac_max_iterations: 10 #1-line RANSAC迭代次数
    mht_Window_neighbor_diff_thresh: 0.174 #mht窗口内相邻mht相差阈值
    enable_mht_optimization: 1 #是否优化mht
    associate_points_to_lines: 1 #将线与点进行关联以辅助三角化
    struct_line_sqrt_info: 10 #结构线约束项权重
    enable_struct_line_margin: 0 #结构线加入边缘化信息
